<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Extractor (Searchable PDF)</title>
    <script type="module" src="/components/app-layout.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    ></script>
    <style>
      @import url("/unified-theme.css");

      .value-badge {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--adw-accent-bg);
        background: var(--primary-light);
        padding: 2px 8px;
        border-radius: 999px;
        min-width: 24px;
        text-align: center;
      }

      .page-card {
        background: var(--adw-view-bg);
        border-radius: var(--radius-lg);
        border: 1px solid var(--adw-card-border);
        overflow: hidden;
        margin-bottom: 24px;
      }
      .page-header {
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.03);
        border-bottom: 1px solid var(--adw-card-border);
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        font-weight: 800;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .table-container {
        overflow-x: auto;
        width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      tr {
        border-bottom: 1px solid var(--adw-card-border);
      }
      tr:last-child {
        border-bottom: none;
      }
      td {
        padding: 10px 16px;
        color: var(--adw-window-fg);
        white-space: nowrap;
        border-right: 1px solid var(--adw-card-border);
      }
      td:last-child {
        border-right: none;
      }
      .row-num {
        width: 2.5rem;
        color: var(--text-muted);
        font-family: var(--font-mono);
        text-align: center;
        background: rgba(0, 0, 0, 0.02);
      }

      .anchor-track {
        position: relative;
        height: 48px;
        background: rgba(0, 0, 0, 0.03);
        border-radius: var(--radius);
        margin: 1.5rem 0;
        border: 2px dashed var(--adw-card-border);
        cursor: crosshair;
        overflow: visible;
        user-select: none;
        transition: all 0.2s;
      }
      .anchor-track:hover {
        border-color: var(--adw-accent-bg);
        background: rgba(0, 0, 0, 0.05);
      }
      .anchor-marker {
        position: absolute;
        top: -2px;
        bottom: -2px;
        width: 4px;
        background: var(--adw-accent-bg);
        z-index: 10;
        cursor: ew-resize;
        border-radius: 2px;
        box-shadow: 0 0 8px rgba(53, 132, 228, 0.3);
        transition: transform 0.1s, background 0.2s;
      }
      .anchor-marker:hover {
        background: var(--primary-hover);
        width: 6px;
        margin-left: -1px;
        z-index: 20;
      }
      .anchor-marker.active {
        background: var(--adw-destructive-bg);
        box-shadow: 0 0 12px rgba(224, 27, 36, 0.5);
        width: 6px;
        margin-left: -1px;
        z-index: 30;
      }

      .anchor-marker span {
        transition: all 0.2s;
        opacity: 0.8;
      }
      .anchor-marker:hover span, .anchor-marker.active span {
        opacity: 1;
        transform: translateX(-50%) scale(1.1);
      }

      .visual-overlay .anchor-marker {
        box-shadow: 0 0 15px rgba(53, 132, 228, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .track-hint {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        color: var(--text-muted);
        pointer-events: none;
      }

      .toggle-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--primary-light);
        padding: 12px 16px;
        border-radius: var(--radius-lg);
        margin-bottom: 1rem;
        border: 1px solid rgba(53, 132, 228, 0.1);
      }

      /* Modal specific styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-container {
        background: var(--adw-window-bg);
        width: 95vw;
        height: 90vh;
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--adw-card-border);
      }
      .modal-header {
        padding: 0 12px;
        background: var(--adw-header-bg);
        min-height: 46px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--adw-card-border);
      }
      .modal-body {
        flex: 1;
        overflow: auto;
        position: relative;
        background: var(--adw-window-bg);
        display: flex;
        justify-content: center;
        padding: 2rem;
      }
      .modal-footer {
        padding: 12px 16px;
        background: var(--adw-header-bg);
        border-top: 1px solid var(--adw-card-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .visual-canvas-wrapper {
        position: relative;
        display: inline-block;
        box-shadow: var(--shadow-lg);
        border-radius: 4px;
        overflow: hidden;
      }
      .visual-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .label-tiny {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="pdf-table-extractor.js">
    </script>
  </body>
</html>
