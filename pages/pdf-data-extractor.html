<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Data Extractor</title>
    <link rel="stylesheet" href="/vendor/nd-switch.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load PDF.js Library -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"
    >
      // Set the workerSrc for PDF.js
      if (typeof pdfjsLib !== "undefined") {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
      }
    </script>
    <script type="module" src="/components/app-layout.js"></script>
    <style>
      @import url("/unified-theme.css");
      .data-table {
        table-layout: auto;
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: 0.875rem;
      }
      .data-table td, .data-table th {
        border: 1px solid var(--adw-card-border);
        padding: 8px;
        text-align: left;
        word-break: break-word;
        white-space: normal;
        min-width: 100px;
      }
      .data-table tr:nth-child(even) {
        background-color: rgba(0, 0, 0, 0.02);
      }
      .file-row td {
        background-color: var(--primary-light) !important;
        font-weight: bold;
        color: #1e3a8a;
        border-top: 2px solid var(--adw-accent-bg);
        font-size: 1rem;
      }
      .meta-col-header {
        background-color: var(--primary-light) !important;
        color: #1e40af !important;
        border-bottom: 2px solid var(--adw-accent-bg) !important;
      }
      .meta-col-cell {
        background-color: rgba(53, 132, 228, 0.05) !important;
        color: #0369a1;
      }
      .drag-active {
        border-color: var(--adw-accent-bg) !important;
        background-color: var(--primary-light) !important;
        transform: scale(1.01);
        transition: all 0.2s ease;
      }
      .modal-backdrop {
        background-color: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
      }
      .regex-scroll::-webkit-scrollbar {
        height: 6px;
      }
      .regex-scroll::-webkit-scrollbar-thumb {
        background-color: var(--adw-card-border);
        border-radius: 3px;
      }
      /* Checkbox styling */
      .meta-checkbox {
        cursor: pointer;
        accent-color: var(--adw-accent-bg);
        transform: scale(1.1);
      }
      .meta-key-label {
        cursor: pointer;
        user-select: none;
      }
      .meta-key-label:hover {
        color: var(--adw-accent-bg);
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="pdf-data-extractor.js"></script>
  </body>
</html>
